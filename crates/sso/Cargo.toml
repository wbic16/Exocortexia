[package]
name = "exo-sso"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Exocortexia SSO gate: HMAC-signed assertions from edit.phext.io and sealed local sessions, for the std-only exo-core HTTP apps."

[lib]
name = "exo_sso"
path = "src/lib.rs"

[dependencies]
exo-core = { path = "../core" }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
